# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Dependency Submission

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  checkUpdates:
    name: Determines all dependencies and submits the list to github for use in dependency insights
    runs-on: ubuntu-latest

    strategy:
      matrix:
        jdk:
          - '26'
        distribution:
          - 'temurin'

    env:
      JAVA_PLATFORM_VERSION: ${{ matrix.jdk }}

    steps:
      # Check out sources
      - name: Fetch Sources
        uses: actions/checkout@v7.0.1

      # Setup JDK environment for the next steps
      - name: Setup ${{ matrix.distribution }} JDK ${{ matrix.jdk }} for gradle
        uses: actions/setup-java@v6.0.1
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.jdk }}
          cache: gradle

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.3.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
